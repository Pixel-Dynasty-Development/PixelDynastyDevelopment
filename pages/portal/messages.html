<h1 class="text-light-heading dark:text-dark-heading mb-8 text-3xl font-bold">
  Send a Direct Message
</h1>
<div class="bg-light-card dark:bg-dark-card rounded-lg p-6 shadow-md">
  <p class="mb-6">
    Have a quick question or update? Send a direct message to us here.
  </p>
  <form class="space-y-6">
    <div>
      <label for="message-subject" class="block text-sm font-medium"
        >Subject</label
      >
      <input
        type="text"
        name="message-subject"
        id="message-subject"
        class="bg-light-bg dark:bg-dark-bg mt-1 block w-full rounded-md border-gray-300 shadow-sm sm:text-sm dark:border-gray-600"
        placeholder="e.g., Quick question about billing"
      />
    </div>
    <div>
      <label for="message-body" class="block text-sm font-medium"
        >Message</label
      >
      <textarea
        id="message-body"
        name="message-body"
        rows="8"
        class="bg-light-bg dark:bg-dark-bg mt-1 block w-full rounded-md border-gray-300 shadow-sm sm:text-sm dark:border-gray-600"
        placeholder="Your message here..."
      ></textarea>
    </div>
    <div>
      <button
        type="submit"
        class="bg-primary-light flex w-full justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:outline-none"
      >
        Send Message
      </button>
    </div>
  </form>
</div>
