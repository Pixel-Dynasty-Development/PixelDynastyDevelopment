</h1>

  <!-- Quick Stats -->
  <div class="bg-light-card dark:bg-dark-card rounded-lg p-6 shadow-md">
    <h2 class="mb-2 text-xl font-semibold">Website Visitors</h2>
    <p class="text-primary-light dark:text-primary-dark text-4xl font-bold">

  <div class="bg-light-card dark:bg-dark-card rounded-lg p-6 shadow-md">

    <p class="text-accent text-4xl font-bold">5</p>
