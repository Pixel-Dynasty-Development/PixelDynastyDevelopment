<!-- 
  This is a simple, styled login page for your clients.
  The form submission is handled in `main.js`.
-->
<section class="bg-light-bg dark:bg-dark-bg py-20 lg:py-28">
  <div class="container mx-auto max-w-md px-4 sm:px-6 lg:px-8">
    <div
      class="bg-light-card dark:bg-dark-card rounded-xl border border-gray-200 p-8 shadow-lg sm:p-10 dark:border-gray-700"
    >
      <h2
        class="text-light-heading dark:text-dark-heading mb-6 text-center text-3xl font-bold sm:text-4xl"
      >
        Client Portal Login
      </h2>
      <form id="login-form" class="space-y-6">
        <div>
          <label
            for="username"
            class="text-light-text dark:text-dark-text mb-2 block text-lg font-medium"
            >Username</label
          >
          <input
            type="text"
            id="username"
            name="username"
            required
            class="focus:ring-primary-light focus:border-primary-light mt-1 block w-full rounded-md border border-gray-300 px-4 py-3 shadow-sm sm:text-lg dark:border-gray-600 dark:bg-gray-700"
            placeholder="client"
          />
        </div>
        <div>
          <label
            for="password"
            class="text-light-text dark:text-dark-text mb-2 block text-lg font-medium"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="focus:ring-primary-light focus:border-primary-light mt-1 block w-full rounded-md border border-gray-300 px-4 py-3 shadow-sm sm:text-lg dark:border-gray-600 dark:bg-gray-700"
            placeholder="password"
          />
        </div>
        <div id="login-error" class="hidden text-center text-red-500">
          Invalid username or password.
        </div>
        <div class="pt-4 text-center">
          <button
            type="submit"
            class="bg-primary-light w-full transform rounded-full px-12 py-3 text-xl font-bold text-white shadow-xl transition-all duration-300 hover:-translate-y-1 hover:bg-blue-700 focus:ring-4 focus:ring-blue-400 focus:outline-none"
          >
            Login
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
