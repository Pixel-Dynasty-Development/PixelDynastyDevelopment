<header
  class="bg-light-card/80 dark:bg-dark-card/80 sticky top-0 z-50 shadow-sm backdrop-blur-md"
>
  <nav class="container mx-auto flex items-center justify-between px-4 py-4">
    <a href="/" data-link class="flex items-center space-x-2">
      <img
        src="/assets/images/PD Logo fullblktxt.png"
        alt="Pixel Dynasty Development Logo"
        class="h-[65px] w-auto"
      />
    </a>

    <div class="hidden items-center space-x-8 text-base font-medium md:flex">
      <a
        href="/about"
        data-link
        class="text-light-text dark:text-dark-text hover:text-primary-light dark:hover:text-primary-dark transition-colors duration-300"
        >About</a
      >
      <a
        href="/portfolio"
        data-link
        class="text-light-text dark:text-dark-text hover:text-primary-light dark:hover:text-primary-dark transition-colors duration-300"
        >Portfolio</a
      >
      <a
        href="/contact"
        data-link
        class="text-light-text dark:text-dark-text hover:text-primary-light dark:hover:text-primary-dark transition-colors duration-300"
        >Contact</a
      >
      <a
        id="portal-nav-link"
        href="/login"
        data-link
        class="bg-primary-light rounded-md px-4 py-2 text-white transition-colors duration-300 hover:bg-blue-700"
        >Client Login</a
      >

      <button
        data-js="theme-toggle"
        type="button"
        class="text-light-text dark:text-dark-text rounded-lg p-2.5 text-sm hover:bg-gray-200 focus:ring-4 focus:ring-gray-200 focus:outline-none dark:hover:bg-gray-700 dark:focus:ring-gray-700"
      >
        <svg
          class="theme-toggle-dark-icon h-5 w-5"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
          ></path>
        </svg>
        <svg
          class="theme-toggle-light-icon hidden h-5 w-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          ></path>
        </svg>
      </button>
    </div>

    <div class="flex items-center space-x-2 md:hidden">
      <button
        data-js="theme-toggle"
        type="button"
        class="text-light-text dark:text-dark-text rounded-lg p-2.5 text-sm hover:bg-gray-200 focus:ring-4 focus:ring-gray-200 focus:outline-none dark:hover:bg-gray-700 dark:focus:ring-gray-700"
      >
        <svg
          class="theme-toggle-dark-icon h-5 w-5"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
          ></path>
        </svg>
        <svg
          class="theme-toggle-light-icon hidden h-5 w-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          ></path>
        </svg>
      </button>

      <button
        id="mobile-menu-button"
        class="text-primary-light dark:text-primary-dark p-1 hover:text-blue-700 focus:outline-none md:hidden dark:hover:text-blue-400"
      >
        <svg
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>
    </div>
  </nav>

  <div
    id="mobile-menu"
    class="bg-light-card dark:bg-dark-card hidden py-2 shadow-lg md:hidden"
  >
    <a
      href="/about"
      data-link
      class="text-light-text dark:text-dark-text hover:text-primary-light dark:hover:text-primary-dark block px-4 py-3 hover:bg-gray-100 dark:hover:bg-gray-700"
      >About</a
    >
    <a
      href="/portfolio"
      data-link
      class="text-light-text dark:text-dark-text hover:text-primary-light dark:hover:text-primary-dark block px-4 py-3 hover:bg-gray-100 dark:hover:bg-gray-700"
      >Portfolio</a
    >
    <a
      href="/contact"
      data-link
      class="text-light-text dark:text-dark-text hover:text-primary-light dark:hover:text-primary-dark block px-4 py-3 hover:bg-gray-100 dark:hover:bg-gray-700"
      >Contact</a
    >
    <a
      href="/login"
      id="mobile-portal-nav-link"
      data-link
      class="text-light-text dark:text-dark-text hover:text-primary-light dark:hover:text-primary-dark block px-4 py-3 hover:bg-gray-100 dark:hover:bg-gray-700"
      >Client Login</a
    >
  </div>
</header>
